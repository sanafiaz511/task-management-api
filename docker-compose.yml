version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_api_app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
      - redis
    networks:
      - tasknet
    user: "1000:1000"

  web:
    image: nginx:latest
    container_name: task_api_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - tasknet

  db:
    image: postgres:15
    container_name: task_api_db
    restart: always
    environment:
      POSTGRES_DB: task_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    networks:
      - tasknet

  redis:
    image: redis:7
    container_name: task_api_redis
    ports:
      - "6379:6379"
    networks:
      - tasknet

networks:
  tasknet: